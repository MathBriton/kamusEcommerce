name: kamus

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kamus
      POSTGRES_USER: kamus
      POSTGRES_PASSWORD: kamus
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kamus -d kamus"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=kamus;Username=kamus;Password=kamus;GSS Encryption Mode=Disable
      ConnectionStrings__Redis: redis:6379
      Cors__Origins__0: http://localhost:3000
      Storage__LocalDisk__RootPath: /app/storage
      Payments__FakePay__WebhookUrl: http://localhost:8080/api/payments/webhooks/fakepay
      Admin__Email: admin@kamus.dev
      Admin__Password: admin-kamus-123
    ports:
      - "5080:8080"
    volumes:
      - api-storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      API_URL: http://api:8080
      SITE_URL: http://localhost:3000
      ENABLE_FULFILLMENT_SIMULATION: "true"
      ENABLE_DESIGN_SYSTEM_PAGE: "true"
    ports:
      - "3000:3000"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    environment:
      API_URL: http://api:8080
      STORE_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  postgres-data:
  api-storage:
