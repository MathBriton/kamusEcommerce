name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Kamus.slnx

      - name: Format check
        run: dotnet format Kamus.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Kamus.slnx --no-restore -c Release

      - name: Test (Testcontainers usa o Docker do runner)
        run: dotnet test --solution Kamus.slnx --no-build -c Release

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  admin:
    name: Admin (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t kamus-api .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t kamus-web .
      - name: Build admin image
        run: docker build -f apps/admin/Dockerfile -t kamus-admin .

  e2e:
    name: E2E e regressão visual
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Lint dos testes
        working-directory: e2e
        run: npm ci && npm run format:check && npm run typecheck

      - name: Fluxos de compra e backoffice + comparação com apps/*/design
        run: ./e2e/run.sh

      - name: Relatório (em caso de falha, inclui as diferenças visuais)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
